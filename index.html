<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concesionario</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Concesionario</h1>
    </header>
    <nav>
        <ul>
            <li><a href="https://www.tesla.com" target="_blank">Tesla</a></li>
            <li><a href="https://www.ferrari.com" target="_blank">Ferrari</a></li>
            <li><a href="https://www.audi.com" target="_blank">Audi</a></li>
            <li><a href="https://www.lamborghini.com" target="_blank">Lamborghini</a></li>
        </ul>
    </nav>

    <main>
        <div class="car-card">
            <img src="img/tesla-model-s.jpg" alt="Tesla Model S">
            <h2>Tesla Model S</h2>
        </div>
        <div class="car-card">
            <img src="img/audi-r8.jpg" alt="Audi R8">
            <h2>Audi R8</h2>
        </div>
        <div class="car-card">
            <img src="img/bmw-m5.jpg" alt="BMW M5">
            <h2>BMW M5</h2>
        </div>
        <div class="car-card">
            <img src="img/mercedes-clase-a.jpg" alt="Mercedes Clase A">
            <h2>Mercedes Clase A</h2>
        </div> 
        <div class="car-card">
            <img src="img/Porsche_911.jpg" alt="Porsche 911">
            <h2>Porsche 911</h2>
        </div>
        <div class="car-card">
            <img src="img/Jaguar_F-Type.jpg" alt="Jaguar F-Type">
            <h2>Jaguar F-Type</h2>
        </div>
        <div class="car-card">
            <img src="img/McLaren_720S.jpg" alt="McLaren 720S">
            <h2>McLaren 720S</h2>
        </div>
        <div class="car-card">
            <img src="img/Toyota_Supra.jpg" alt="Toyota Supra">
            <h2>Toyota Supra</h2>
        </div>
    </main>

    <footer>
        <p>© Deluxe 2025</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
